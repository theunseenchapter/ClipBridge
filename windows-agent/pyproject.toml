[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipbridge-windows"
version = "0.1.0"
description = "ClipBridge Windows agent foundation"
readme = "README.md"
license = { file = "../LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]

[tool.setuptools]
packages = ["clipbridge"]
